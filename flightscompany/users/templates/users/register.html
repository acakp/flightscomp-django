{% extends "flightsco_app/base.html" %}
{% block title %}{{ title }} - Флайтс Компани{% endblock %}
{% block content %}
    <main class="form-page">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="form-card">
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                            <div>
                                <h1 class="mb-1">{{ title }}</h1>
                            </div>
                        </div>
                        <form action="" method="post" class="offer-form">
                            {% csrf_token %}
                            <div class="form-error">{{ form.non_field_errors }}</div>
                            {% for f in form %}
                                <div class="form-row-block">
                                    <label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}</label>
                                    {{ f }}
                                    <div class="form-error">{{ f.errors }}</div>
                                </div>
                            {% endfor %}
                            <button type="submit" class="btn btn-primary btn-lg w-100">Зарегистрироваться</button>
                        </form>
                        <div class="mt-4 text-center">
                            <p>Уже есть аккаунт? <a href="{% url 'users:login' %}">Войти</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
{% endblock %}
